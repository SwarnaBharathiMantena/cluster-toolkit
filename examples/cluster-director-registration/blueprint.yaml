---

blueprint_name: ctkdemo

# This blueprint contains no registration wiring of any kind. `gcluster deploy`
# registers the deployment into Cluster Director on its own, and
# `gcluster destroy` deregisters it. Pass
# --skip-cluster-director-registration to either command to opt out.
vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: ctkdemo
  region: us-central1
  zone: us-central1-a

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: ctk_bucket
    source: modules/file-system/cloud-storage-bucket
    settings:
      random_suffix: true

  - id: compute
    source: modules/compute/vm-instance
    use: [network]
    settings:
      instance_count: 2
      machine_type: e2-standard-2
