# ==============================================================================
# Cluster Deployment Variables: tpu6e-team-alpha (-d flag)
# ==============================================================================
# Usage:
#   ./gcluster deploy examples/shared-tpu-clusters/shared-tpu-v6e-clusters/base.yaml \
#     -d examples/shared-tpu-clusters/shared-tpu-v6e-clusters/tpu6e-team-alpha/deployment-vars.yaml -w
# ==============================================================================

vars:
  project_id: hpc-toolkit-gsc
  deployment_name: tpu6e-team-alpha
  region: southamerica-west1
  zone: southamerica-west1-a

  # Relative path from base.yaml to this parallel child cluster directory
  cluster_dir: "./tpu6e-team-alpha"

  machine_type: ct6e-standard-4t
  num_slices: 2
  tpu_topology: 2x4
  reservation: projects/hpc-toolkit-gsc/reservations/tpu6e-team-alpha-res
  authorized_cidr: "0.0.0.0/0"

  # Cohort & Parameterized Quota Limits (Cory Comment #2)
  cohort_name: "tpuv6e-shared-cohort"
  total_tpu_capacity: "64"
  total_cpu_capacity: "180"
  total_memory_capacity: "1200Gi"

  # Team Alpha nominal share
  team_alpha_nominal_tpu: "32"
  team_alpha_nominal_cpu: "90"
  team_alpha_nominal_memory: "600Gi"

  # Team Beta nominal share
  team_beta_nominal_tpu: "32"
  team_beta_nominal_cpu: "90"
  team_beta_nominal_memory: "600Gi"
